name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 wasm 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nwasm -> wasm/target"

      # 单元测试 + 端到端集成测试（tests/e2e.rs 会真的把服务拉起来）
      - name: Rust 测试
        run: cargo test

      - name: wasm 哈希器测试
        run: cargo test --manifest-path wasm/Cargo.toml

      - name: 构建 release 产物
        run: cargo build --release

      - name: 前端接线与同步策略检查
        run: |
          node scripts/check-ui.mjs
          node scripts/check-sync-policy.mjs

      # 两条硬规则里的一条：哈希算法由主程序与 wasm 共用同一份源码，
      # 所以仓库里的 wasm 产物必须跟着源码走，否则说明忘了重新构建并提交。
      # 比的是摘要（不是字节）：不同 rustc 版本编出的 wasm 字节数会差很多，但摘要必须一致。
      # 同一步顺带把 wasm / CLI / Node crypto 三方摘要对齐。
      - name: 校验 wasm 产物与源码一致（并比对三方摘要）
        run: |
          cp web/sync_video_player_hash.wasm "$RUNNER_TEMP/committed.wasm"
          bash scripts/build-wasm.sh
          WASM_COMPARE="$RUNNER_TEMP/committed.wasm" node scripts/check-wasm.mjs target/release/sync_video_player

      - name: 端到端冒烟测试
        run: bash scripts/smoke.sh
