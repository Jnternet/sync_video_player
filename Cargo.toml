[package]
name = "sync_video_player"
version = "0.1.4"
edition = "2021"
description = "局域网同步播放器：Rust 单文件后端 + 浏览器前端，只同步控制信息"

[[bin]]
name = "sync_video_player"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
